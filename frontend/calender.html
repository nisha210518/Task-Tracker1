<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow - Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-xs text-slate-400 hover:text-white">&larr; Dashboard</a>
      <h1 class="text-lg font-black text-indigo-500 tracking-wider">MONTHLY SCHEDULER</h1>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto p-6 space-y-6">
    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
      <div class="flex justify-between items-center mb-6">
        <h3 id="currentMonthYear" class="text-xl font-bold">Month Calendar</h3>
        <span class="text-xs bg-slate-800 px-3 py-1 rounded text-slate-400">Deadlines View</span>
      </div>
      <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 uppercase mb-2">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
    </div>
  </main>

  <script src="js/calendar.js"></script>
</body>
</html>
