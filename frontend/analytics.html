<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow - Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-xs text-slate-400 hover:text-white">&larr; Dashboard</a>
      <h1 class="text-lg font-black text-indigo-500 tracking-wider">PRODUCTIVITY LABS</h1>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="md:col-span-1 bg-slate-900 p-6 rounded-2xl border border-slate-800 flex flex-col justify-center space-y-4 shadow-xl">
      <div class="text-center">
        <h4 class="text-xs uppercase text-slate-400 font-bold tracking-widest">Completion Rate</h4>
        <p id="rateVal" class="text-5xl font-black text-indigo-400 mt-2">0%</p>
      </div>
    </div>

    <div class="md:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
      <h3 class="text-base font-bold mb-4">Task Split Distribution</h3>
      <div class="h-64 flex justify-center">
        <canvas id="splitChart"></canvas>
      </div>
    </div>
  </main>

  <script src="js/analytics.js"></script>
</body>
</html>
