<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow - Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-xs text-slate-400 hover:text-white">&larr; Dashboard</a>
      <h1 class="text-lg font-black text-indigo-500 tracking-wider">SYSTEM PREFERENCES</h1>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto p-6 mt-12 bg-slate-900 rounded-2xl border border-slate-800 shadow-xl space-y-6">
    <h3 class="text-lg font-bold">App Settings</h3>
    <div class="space-y-4">
      <div class="flex justify-between items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
        <div>
          <h4 class="text-sm font-semibold">Fatigue Protection Shield</h4>
          <p class="text-xxs text-slate-400">Auto-isolate overwhelming, delayed task backlogs.</p>
        </div>
        <span class="text-xs uppercase text-emerald-400 font-bold">Enabled</span>
      </div>
      <button onclick="clearLocalSession()" class="w-full bg-red-950/40 hover:bg-red-600 text-red-400 hover:text-white border border-red-900 py-2 rounded-lg text-sm font-bold transition">
        Clear Local Session & Log Out
      </button>
    </div>
  </main>

  <script src="js/settings.js"></script>
</body>
</html>
