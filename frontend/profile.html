<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow - Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 flex justify-between items-center">
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="text-xs text-slate-400 hover:text-white">&larr; Dashboard</a>
      <h1 class="text-lg font-black text-indigo-500 tracking-wider">MY LEVEL PROGRESS</h1>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto p-6 mt-12 bg-slate-900 rounded-2xl border border-slate-800 shadow-xl space-y-6">
    <div class="text-center">
      <div class="h-20 w-20 bg-indigo-600 rounded-full mx-auto flex items-center justify-center font-black text-2xl" id="profileInitials">TF</div>
      <h2 id="profileUsername" class="text-xl font-bold mt-4">---</h2>
      <p id="profileEmail" class="text-xs text-slate-400">---</p>
    </div>

    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 grid grid-cols-2 gap-4 text-center">
      <div>
        <p class="text-[10px] uppercase text-slate-500 font-bold">Current Level</p>
        <p id="profileLevel" class="text-xl font-black text-indigo-400">0</p>
      </div>
      <div>
        <p class="text-[10px] uppercase text-slate-500 font-bold">Reputation Score</p>
        <p id="profileRep" class="text-xl font-black text-emerald-400">0</p>
      </div>
    </div>
  </main>

  <script src="js/profile.js"></script>
</body>
</html>
